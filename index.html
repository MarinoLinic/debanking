<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Debanking Tracker</title>

		<!-- Favicon -->
		<link rel="icon" type="image/x-icon" href="favicon.ico" />

		<!-- Social Media / Open Graph -->
		<meta property="og:title" content="Debanking Tracker" />
		<meta
			property="og:description"
			content="Monitoring the weaponization of the banking system against political dissidents."
		/>
		<meta property="og:image" content="image.jpg" />
		<meta property="og:type" content="website" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="image.jpg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital@0;1&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<a id="top"></a>

		<header class="site-header">
			<div class="site-header-inner">
				<!-- Toggle Button Area -->
				<div class="quote-toggle-wrapper">
					<button id="quoteToggleBtn" class="toggle-btn" onclick="toggleQuote()">Hide Quote Context</button>
				</div>

				<!-- Collapsible Quote Carousel -->
				<div id="quoteContainer" class="quote-container" onmouseenter="pauseCarousel()" onmouseleave="resumeCarousel()">
					<div class="carousel-wrapper">
						<button class="carousel-btn prev" onclick="moveSlide(-1)">&#10094;</button>
						<div id="quoteSlides">
							<!-- Slides injected via JS -->
						</div>
						<button class="carousel-btn next" onclick="moveSlide(1)">&#10095;</button>
					</div>
				</div>

				<h1 class="site-title"><em>Debanking</em> Tracker</h1>
				<p class="site-subtitle">Monitoring the weaponization of the banking system against political dissidents.</p>

				<div class="tabs">
					<button id="tab-debanking" class="tab-btn active" onclick="switchTab('debanking')">Debanking List</button>
					<button id="tab-alternatives" class="tab-btn" onclick="switchTab('alternatives')">Alternatives</button>
				</div>
				<div class="header-spacer"></div>
			</div>
		</header>

		<!-- Filter Controls -->
		<div class="controls-bar">
			<div class="controls-inner">
				<div class="layout-controls">
					<button class="layout-btn active" id="btn-grid" onclick="switchLayout('grid')" title="Grid View">Grid</button>
					<button class="layout-btn" id="btn-list" onclick="switchLayout('list')" title="List View">List</button>
					<button class="layout-btn" id="btn-table" onclick="switchLayout('table')" title="Table View">Table</button>
				</div>
				<input
					type="text"
					id="searchInput"
					class="search-input"
					placeholder="Search names, people, desc..."
					oninput="handleSearch(this.value)"
				/>
				<select id="countrySelect" class="custom-select" onchange="addFilter('country', this.value)">
					<option value="">All Countries</option>
				</select>
				<select id="typeSelect" class="custom-select" onchange="addFilter('type', this.value)">
					<option value="">All Types</option>
				</select>
				<select id="personSelect" class="custom-select" onchange="addFilter('person', this.value)">
					<option value="">All People</option>
				</select>
				<button id="clearBtn" class="clear-btn" onclick="clearAllFilters()">Clear Filters</button>
			</div>
		</div>

		<!-- Results count + active filter chips -->
		<div class="content-meta">
			<span id="resultsCount" class="results-count">Loading...</span>
			<div class="active-filters" id="activeFilters"></div>
		</div>

		<!-- Main Content Area -->
		<div id="contentArea" class="grid-view">
			<div style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 50px">
				Loading data...<br />
				<small>Note: If viewing locally, ensure you are running a local server (CORS).</small>
			</div>
		</div>

		<!-- Footer -->
		<footer>
			Created by <strong>Marino Linich</strong> &bull;
			<a href="https://x.com/MarinoLinic" target="_blank">Contact via X</a> &bull;
			<a href="https://github.com/MarinoLinic/debanking" target="_blank">GitHub Repo</a> &bull;
			<a href="https://marinolinich.substack.com/" target="_blank">Substack</a>
		</footer>

		<!-- Floating Scroll Controls -->
		<div class="scroll-controls">
			<button class="scroll-btn" onclick="window.scrollTo(0,0)" title="Scroll to Top">↑</button>
			<button class="scroll-btn" onclick="window.scrollTo(0, document.body.scrollHeight)" title="Scroll to Bottom">
				↓
			</button>
		</div>
		<script src="script.js"></script>
	</body>
</html>
